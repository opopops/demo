apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: app
  namespace: flux
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: app
  inputs:
    - cluster: "gladia-eu-200"
      environment: "staging"
      variant: "blue"
      version: ">=0.0.0-0"
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: app-<< inputs.variant >>
        namespace: << inputs.cluster >>
      spec:
        interval: 5m
        url: oci://ghcr.io/opopops/demo/helm/app
        ref:
          semver: << inputs.version | quote >>
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: app-<< inputs.variant >>
        namespace: << inputs.cluster >>
      spec:
        kubeConfig:
          secretRef:
            name: << inputs.cluster >>-kubeconfig
        interval: 30m
        releaseName: app-<< inputs.variant >>
        storageNamespace: default
        targetNamespace: default
        install:
          createNamespace: true
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 3
        test:
          enable: false
        driftDetection:
          mode: enabled
          ignore:
            - paths: ["/spec/replicas"]
              target:
                kind: Deployment
        chartRef:
          kind: OCIRepository
          name: app-<< inputs.variant >>
        values:
          replicaCount: 1
